name: jellyfin ci

on:
  pull_request:
    paths:
      - "apps/media/jellyfin/**"
      - ".github/workflows/jellyfin-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/media/jellyfin/**"
      - ".github/workflows/jellyfin-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/media/jellyfin/deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate compose
        env:
          OPENVPN_USER: dummy
          OPENVPN_PASSWORD: dummy
        run: docker compose config -q > /dev/null
