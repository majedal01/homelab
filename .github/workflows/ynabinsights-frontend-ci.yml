name: ynabInsights frontend CI

on:
  pull_request:
    paths:
      - "apps/finance/ynabInsights/frontend/**"
      - ".github/workflows/ynabinsights-frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/finance/ynabInsights/frontend/**"
      - ".github/workflows/ynabinsights-frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/finance/ynabInsights/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        # --legacy-peer-deps: Tremor v3 peer-deps React 18 but works with
        # React 19 in practice. Switch to `npm ci` once a committed
        # package-lock.json exists.
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build does not need backend access; types are pre-committed.
          BACKEND_URL: http://app:8000
