name: deploy

# Reusable: copy a compose file to a VM over Tailscale, pull, restart, smoke check.
# Image builds belong to the caller. Callers map their own VM secrets so one
# workflow serves every host.

on:
  workflow_call:
    inputs:
      stack:
        description: Folder under /home/deploy/stacks on the VM (e.g. jellyfin, ynabinsights/stage).
        required: true
        type: string
      compose_file:
        description: Compose file in the caller's checkout.
        required: true
        type: string
      health_url:
        description: URL curled on the VM after the stack is up.
        required: true
        type: string
      version:
        description: Exported as APP_VERSION for compose.
        required: false
        type: string
        default: ""
    secrets:
      ssh_key:
        required: true
      vm_hostname:
        required: true
      vm_user:
        required: true
      ts_oauth_client_id:
        required: true
      ts_oauth_secret:
        required: true
      registry_token:
        description: Token for ghcr.io if the images are private.
        required: false
      env_lines:
        description: KEY=VALUE lines written into the stack's .env, replacing existing keys.
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STACK: /home/deploy/stacks/${{ inputs.stack }}
      TARGET: ${{ secrets.vm_user }}@${{ secrets.vm_hostname }}
      ENV_LINES: ${{ secrets.env_lines }}
      REGISTRY_TOKEN: ${{ secrets.registry_token }}
    steps:
      - uses: actions/checkout@v5

      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: tag:ci

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ssh_key }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.vm_hostname }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/deploy_key\n' > ~/.ssh/config

      - name: Copy compose file
        run: |
          ssh "$TARGET" "mkdir -p '$STACK'"
          scp "${{ inputs.compose_file }}" "$TARGET:$STACK/docker-compose.yml"

      - name: Write env lines
        if: ${{ env.ENV_LINES != '' }}
        run: |
          printf '%s\n' "$ENV_LINES" > env.new
          scp env.new "$TARGET:$STACK/.env.new"
          ssh "$TARGET" bash -s "$STACK" <<'EOF'
          cd "$1" && touch .env
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            sed -i "/^${line%%=*}=/d" .env
            printf '%s\n' "$line" >> .env
          done < .env.new
          rm .env.new
          EOF

      - name: Registry login
        if: ${{ env.REGISTRY_TOKEN != '' }}
        run: printf '%s' "$REGISTRY_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull and restart
        run: ssh "$TARGET" "cd '$STACK' && export APP_VERSION='${{ inputs.version || github.sha }}' && docker compose pull && docker compose up -d --remove-orphans"

      - name: Smoke check
        run: ssh "$TARGET" "curl --fail --max-time 10 --retry 30 --retry-delay 2 --retry-all-errors '${{ inputs.health_url }}'"

      - name: Prune dangling images
        run: ssh "$TARGET" "docker image prune -af"
