name: Deploy (reusable)

# Reusable deploy for built-service apps (FastAPI backend + Next.js frontend).
# Builds and pushes both images to ghcr.io, then deploys the env's compose stack
# to the VM over Tailscale and smoke-checks /health. Appliance stacks (e.g. media)
# do not use this; they run off-the-shelf images deployed by hand.
#
# Conventions (see docs/CONVENTIONS.md):
#   image       ghcr.io/majedal01/homelab/<app>[_frontend]:<env>-<sha|latest>
#   compose     apps/<app>/deploy/<env>/docker-compose.yml
#   VM stack    /home/deploy/stacks/<app>/<env>

on:
  workflow_call:
    inputs:
      app:
        description: App name; image repo base and VM stack folder.
        required: true
        type: string
      environment:
        description: Target environment (stage or prod).
        required: true
        type: string
      port:
        description: Host port to smoke-check /health against.
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.app }}
          file: apps/${{ inputs.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/majedal01/homelab/${{ inputs.app }}:${{ inputs.environment }}-${{ github.sha }}
            ghcr.io/majedal01/homelab/${{ inputs.app }}:${{ inputs.environment }}-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.app }}/frontend
          file: apps/${{ inputs.app }}/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/majedal01/homelab/${{ inputs.app }}_frontend:${{ inputs.environment }}-${{ github.sha }}
            ghcr.io/majedal01/homelab/${{ inputs.app }}_frontend:${{ inputs.environment }}-latest

      - name: Join tailnet
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add VM to known_hosts
        run: ssh-keyscan -H "${{ secrets.VM_HOSTNAME }}" >> ~/.ssh/known_hosts

      - name: Copy compose file to VM
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "mkdir -p /home/deploy/stacks/${{ inputs.app }}/${{ inputs.environment }}"
          scp -i ~/.ssh/deploy_key \
            apps/${{ inputs.app }}/deploy/${{ inputs.environment }}/docker-compose.yml \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}:/home/deploy/stacks/${{ inputs.app }}/${{ inputs.environment }}/docker-compose.yml"

      - name: Sync env vars into .env on VM
        # Platform env vars for the FastAPI app, persisted across deploys.
        # - REQUIRE_PROXY_HEADERS / LOG_GENERATOR_INTERNALS: idempotent, set if missing.
        # - METRICS_ADMIN_TOKEN: rotated via GitHub Secrets, always replaced; /metrics
        #   404s gracefully when unset.
        # SESSION_SECRET_KEY and other app secrets are managed by hand on the VM and are
        # not touched here, so the env's .env must already exist with them.
        env:
          ADMIN_TOKEN: ${{ secrets.METRICS_ADMIN_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "cd /home/deploy/stacks/${{ inputs.app }}/${{ inputs.environment }} && \
             touch .env && \
             grep -q '^REQUIRE_PROXY_HEADERS=' .env || echo 'REQUIRE_PROXY_HEADERS=true' >> .env && \
             grep -q '^LOG_GENERATOR_INTERNALS=' .env || echo 'LOG_GENERATOR_INTERNALS=true' >> .env && \
             sed -i '/^METRICS_ADMIN_TOKEN=/d' .env && \
             printf 'METRICS_ADMIN_TOKEN=%s\n' '${ADMIN_TOKEN}' >> .env"

      - name: Pull image and restart stack
        # --remove-orphans kills containers for services dropped from the compose file
        # so deleted services do not keep running and consuming memory.
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "cd /home/deploy/stacks/${{ inputs.app }}/${{ inputs.environment }} && \
             export APP_VERSION=${{ github.sha }} && \
             docker compose pull && \
             docker compose up -d --remove-orphans"

      - name: Smoke check /health
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "curl --fail --max-time 10 --retry 30 --retry-delay 2 --retry-all-errors http://localhost:${{ inputs.port }}/health"

      - name: Prune dangling images
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "docker image prune -af"
