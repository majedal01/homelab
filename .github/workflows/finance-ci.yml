name: Finance CI

on:
  pull_request:
    paths:
      - "apps/finance/**"
      - ".github/workflows/finance-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/finance/**"
      - ".github/workflows/finance-ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/finance/pyproject.toml

      - name: Install package with dev extras
        working-directory: apps/finance
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: apps/finance
        run: ruff check .

      - name: Ruff format check
        working-directory: apps/finance
        run: ruff format --check .

      - name: mypy
        run: mypy --config-file apps/finance/pyproject.toml apps/finance

      - name: pytest
        working-directory: apps/finance
        run: pytest
