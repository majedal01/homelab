name: Deploy stage

on:
  push:
    branches: [main]

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ynab_insights
          file: ynab_insights/Dockerfile
          push: true
          tags: |
            ghcr.io/majedal01/homelab/ynab_insights:stage-${{ github.sha }}
            ghcr.io/majedal01/homelab/ynab_insights:stage-latest

      - name: Join tailnet
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add VM to known_hosts
        run: ssh-keyscan -H "${{ secrets.VM_HOSTNAME }}" >> ~/.ssh/known_hosts

      - name: Copy compose file to VM
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/compose/stage/docker-compose.yml \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}:/home/deploy/stacks/stage/docker-compose.yml"

      - name: Pull image and restart stack
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "cd /home/deploy/stacks/stage && \
             export APP_VERSION=${{ github.sha }} && \
             docker compose pull && \
             docker compose up -d"

      - name: Smoke check /health
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "curl --fail --max-time 10 --retry 5 --retry-delay 2 http://localhost:8001/health"
