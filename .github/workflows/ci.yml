name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ynab_insights/pyproject.toml

      - name: Install package with dev extras
        working-directory: ynab_insights
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: ynab_insights
        run: ruff check .

      - name: Ruff format check
        working-directory: ynab_insights
        run: ruff format --check .

      - name: mypy
        run: mypy --config-file ynab_insights/pyproject.toml ynab_insights

      - name: pytest
        working-directory: ynab_insights
        run: pytest
