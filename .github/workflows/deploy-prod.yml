name: Deploy prod

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ynab_insights
          file: ynab_insights/Dockerfile
          push: true
          tags: |
            ghcr.io/majedal01/homelab/ynab_insights:prod-${{ github.sha }}
            ghcr.io/majedal01/homelab/ynab_insights:prod-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ynab_insights/frontend
          file: ynab_insights/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/majedal01/homelab/ynab_insights_frontend:prod-${{ github.sha }}
            ghcr.io/majedal01/homelab/ynab_insights_frontend:prod-latest

      - name: Join tailnet
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add VM to known_hosts
        run: ssh-keyscan -H "${{ secrets.VM_HOSTNAME }}" >> ~/.ssh/known_hosts

      - name: Copy compose file to VM
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/compose/prod/docker-compose.yml \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}:/home/deploy/stacks/prod/docker-compose.yml"

      - name: Sync env vars into .env on VM
        # Persist the v2.6e env vars so they survive container restarts
        # outside this deploy. REQUIRE_PROXY_HEADERS is idempotent;
        # METRICS_ADMIN_TOKEN is replaced from the GitHub Secret on every
        # deploy so rotation is just a re-run away.
        env:
          ADMIN_TOKEN: ${{ secrets.METRICS_ADMIN_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "cd /home/deploy/stacks/prod && \
             grep -q '^REQUIRE_PROXY_HEADERS=' .env || echo 'REQUIRE_PROXY_HEADERS=true' >> .env && \
             sed -i '/^METRICS_ADMIN_TOKEN=/d' .env && \
             printf 'METRICS_ADMIN_TOKEN=%s\n' '${ADMIN_TOKEN}' >> .env"

      - name: Pull image and restart stack
        # `--remove-orphans` kills containers for services that used to be in
        # the compose file but aren't anymore (e.g. the v2.4 `db` service that
        # outlived the v2.5 deploy). Without it, deleted services keep running
        # and silently consume memory.
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "cd /home/deploy/stacks/prod && \
             export APP_VERSION=${{ github.sha }} && \
             docker compose pull && \
             docker compose up -d --remove-orphans"

      - name: Smoke check /health
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "curl --fail --max-time 10 --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8002/health"

      - name: Prune dangling images
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VM_DEPLOY_USER }}@${{ secrets.VM_HOSTNAME }}" \
            "docker image prune -af"
