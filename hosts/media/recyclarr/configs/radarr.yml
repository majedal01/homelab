# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
# One profile for every movie: the best release available now, upgraded to 2160p WEB when
# one appears, never below 1080p. Remux and full Bluray-2160p are excluded on purpose; a
# 50G remux does not fit a 300G disk shared with the OS. Sizes are capped by hand in
# Radarr's quality definitions (see ../../README.md), so quality_definition is left out
# here to keep a sync from overwriting them.
radarr:
  movies:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    quality_profiles:
      - name: UHD WEB + HD
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p

    # Guide groups only auto-sync for guide-backed profiles, so each one is assigned here.
    custom_format_groups:
      add:
        - trash_id: 9d5acd8f1da78dfbae788182f7605200  # [Audio] Audio Formats
          assign_scores_to:
            - name: UHD WEB + HD
        - trash_id: ef20e67b95a381fb3bc6d1f06ea24f46  # [HDR Formats] HDR
          assign_scores_to:
            - name: UHD WEB + HD
        - trash_id: d9cc9a504e5ede6294c8b973aad4f028  # [Streaming Services] General
          assign_scores_to:
            - name: UHD WEB + HD
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD
          select:
            - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
            - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
          assign_scores_to:
            - name: UHD WEB + HD
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select:
            - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
            - cae4ca30163749b891686f95532519bd  # AV1
            - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
            - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
            - ed38b889b31be83fda192888e2286d83  # BR-DISK
            - 0a3f082873eb454bde444150b70253cc  # Extras
            - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
            - 90a6f9a284dff5103f6346090e6280c8  # LQ
            - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
            - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
            - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
          assign_scores_to:
            - name: UHD WEB + HD
