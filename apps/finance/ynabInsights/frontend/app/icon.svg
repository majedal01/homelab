  />
  <circle cx="3" cy="18" r="1.8" fill="#e2e8f0"/>
  <circle cx="8" cy="13" r="1.8" fill="#e2e8f0"/>
  <circle cx="12" cy="16" r="1.8" fill="#e2e8f0"/>
