services:
  frontend:
    image: ghcr.io/majedal01/homelab/ynabinsights_frontend:stage-latest
    pull_policy: always
    ports:
      - "8001:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://app:8000
    depends_on:
      - app
    restart: unless-stopped

  app:
    image: ghcr.io/majedal01/homelab/ynabinsights:stage-latest
    pull_policy: always
    # No host port mapping; only the frontend talks to FastAPI over the
    # compose-internal network at http://app:8000.
    environment:
      APP_ENV: stage
      APP_VERSION: ${APP_VERSION:-unknown}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY is required}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      # v2.6e: warn-only proxy-header check + metrics token gate.
      REQUIRE_PROXY_HEADERS: ${REQUIRE_PROXY_HEADERS:-false}
      METRICS_ADMIN_TOKEN: ${METRICS_ADMIN_TOKEN:-}
      # v2.6g: per-step diagnostic logging across every generator. Stage
      # is on by default so we can diagnose "why did this card miss" by
      # reading container logs instead of attaching a debugger.
      LOG_GENERATOR_INTERNALS: ${LOG_GENERATOR_INTERNALS:-true}
    restart: unless-stopped
