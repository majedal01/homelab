# Local development stack (v2.5): frontend (hot reload) + FastAPI (--reload).
# No database; user state lives in-process per-session.
#
# Usage:
#   docker compose -f apps/finance/ynabInsights/deploy/dev/docker-compose.yml up

name: ynabinsights-dev

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://app:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app

  app:
    image: python:3.12-slim
    working_dir: /service
    command: sh -c "pip install -e '.[dev]' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: stage
      APP_VERSION: dev
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-dev-only-change-me}
      # Default model when the user doesn't pick one on the welcome screen.
      # Override per env without rebuilding. Valid values: claude-haiku-4-5-20251001,
      # claude-sonnet-4-6, claude-opus-4-7.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    volumes:
      - ../../:/service

volumes:
  frontend_node_modules:
