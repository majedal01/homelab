services:
  frontend:
    image: ghcr.io/majedal01/homelab/ynab_insights_frontend:prod-latest
    pull_policy: always
    ports:
      - "8002:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://app:8000
    depends_on:
      - app
    restart: unless-stopped

  app:
    image: ghcr.io/majedal01/homelab/ynab_insights:prod-latest
    pull_policy: always
    environment:
      APP_ENV: prod
      APP_VERSION: ${APP_VERSION:-unknown}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY is required}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
    restart: unless-stopped
