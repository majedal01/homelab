services:
  frontend:
    image: ghcr.io/majedal01/homelab/ynab_insights_frontend:stage-latest
    pull_policy: always
    ports:
      - "8001:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://app:8000
    depends_on:
      - app
    restart: unless-stopped

  app:
    image: ghcr.io/majedal01/homelab/ynab_insights:stage-latest
    pull_policy: always
    # No host port mapping; only the frontend talks to FastAPI over the
    # compose-internal network at http://app:8000.
    environment:
      APP_ENV: stage
      APP_VERSION: ${APP_VERSION:-unknown}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY is required}
    restart: unless-stopped
