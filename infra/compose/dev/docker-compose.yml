# Local development stack (v2.5): frontend (hot reload) + FastAPI (--reload).
# No database; user state lives in-process per-session.
#
# Usage:
#   docker compose -f infra/compose/dev/docker-compose.yml up

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://app:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../../../ynab_insights/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app

  app:
    image: python:3.12-slim
    working_dir: /service
    command: sh -c "pip install -e '.[dev]' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: stage
      APP_VERSION: dev
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-dev-only-change-me}
    volumes:
      - ../../../ynab_insights:/service

volumes:
  frontend_node_modules:
