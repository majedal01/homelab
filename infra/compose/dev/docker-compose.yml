# Local development stack: frontend (with hot reload), FastAPI (with --reload),
# Postgres. Source code is bind-mounted; no images are built or pulled from
# ghcr.
#
# Usage:
#   cd <repo root>
#   cp infra/compose/dev/.env.example infra/compose/dev/.env  # first time only
#   docker compose -f infra/compose/dev/docker-compose.yml up
#
# Frontend at http://localhost:3000, FastAPI at http://localhost:8000.

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://app:8000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../../../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - app

  app:
    image: python:3.12-slim
    working_dir: /service
    command: sh -c "pip install -e '.[dev]' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: stage
      APP_VERSION: dev
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
      YNAB_TOKEN: ${YNAB_TOKEN:-}
      YNAB_BUDGET_ID: ${YNAB_BUDGET_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ../../../ynab_insights:/service
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-dev}
    ports:
      - "5432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data

volumes:
  dev_pgdata:
  frontend_node_modules:
