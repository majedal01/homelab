{% for t in recent %}
<div class="flex justify-between items-start py-2 border-b border-gray-100 last:border-0 text-sm">
    <div class="min-w-0 pr-4">
        <div class="truncate">{{ t.payee_name or "—" }}</div>
        <div class="text-xs text-gray-500 truncate">
            {{ t.date }} · {{ t.account_name }} · {{ t.category_name or "Uncategorized" }}
            {%- if t.memo %} · {{ t.memo }}{% endif %}
        </div>
    </div>
    <div class="font-mono whitespace-nowrap {% if t.amount_cents < 0 %}text-red-600{% else %}text-green-600{% endif %}">
        {{ t.amount_cents | dollars }}
    </div>
</div>
{% endfor %}
{% if has_more %}
<div id="load-more-anchor" class="text-center mt-3">
    <button hx-get="/_partials/transactions?budget_id={{ selected_budget_id }}&offset={{ next_offset }}"
            hx-target="#load-more-anchor"
            hx-swap="outerHTML"
            class="text-sm text-blue-600 hover:underline">
        Load more
    </button>
</div>
{% endif %}
