{% extends "base.html" %}

{% block title %}{{ category.name }} - YNAB Insights{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="/" class="text-sm text-blue-600 hover:underline">&larr; Dashboard</a>
</div>

<section class="bg-white rounded-lg shadow p-4 mb-4">
    <h2 class="text-xl font-semibold">{{ category.name }}</h2>
    {% if category.hidden %}
    <span class="text-xs text-gray-500">Hidden category</span>
    {% endif %}
</section>

<form class="bg-white rounded-lg shadow p-4 mb-4 flex flex-wrap items-end gap-4"
      hx-get="/_partials/category_transactions"
      hx-target="#category-transactions"
      hx-trigger="submit, change from:input[type=date] delay:300ms">
    <input type="hidden" name="category_id" value="{{ category.id }}">
    <div>
        <label for="date_from" class="block text-xs text-gray-500 mb-1">From</label>
        <input type="date" id="date_from" name="date_from" value="{{ date_from }}"
               class="border border-gray-300 rounded px-2 py-1 text-sm">
    </div>
    <div>
        <label for="date_to" class="block text-xs text-gray-500 mb-1">To</label>
        <input type="date" id="date_to" name="date_to" value="{{ date_to }}"
               class="border border-gray-300 rounded px-2 py-1 text-sm">
    </div>
    <button type="submit"
            class="bg-blue-600 text-white text-sm px-3 py-1.5 rounded hover:bg-blue-700">
        Apply
    </button>
</form>

<section id="category-transactions" class="bg-white rounded-lg shadow p-4">
    {% include "partials/category_transactions.html" %}
</section>
{% endblock %}
