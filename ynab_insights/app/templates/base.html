<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YNAB Insights{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
        .htmx-request.htmx-indicator { display: inline; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-white border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="text-xl font-semibold">YNAB Insights</a>
            {% if budgets %}
            <form method="get" action="/" class="flex items-center gap-2 text-sm">
                <label for="budget_id" class="text-gray-500">Budget:</label>
                <select name="budget_id" id="budget_id" onchange="this.form.submit()"
                        class="border border-gray-300 rounded px-2 py-1 bg-white">
                    {% for b in budgets %}
                    <option value="{{ b.id }}" {% if b.id == selected_budget_id %}selected{% endif %}>{{ b.name }}</option>
                    {% endfor %}
                </select>
            </form>
            {% endif %}
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-6 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
